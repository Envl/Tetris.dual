name = "tetris-dual-web"
compatibility_date = "2024-01-01"
pages_build_output_dir = ".svelte-kit/cloudflare"

[durable_objects]
bindings = [
  { name = "MATCHMAKING", class_name = "MatchmakingRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["MatchmakingRoom"]

[[d1_databases]]
binding = "DB"
database_name = "tetris-dual-db"
database_id = "your-database-id"

[vars]
# Add any environment variables here
